name: pages
# On a PR: validate only (legal requisites filled + links resolve + CNAME) — a visible
# check, no deploy. On push to main: validate, then deploy to GitHub Pages. The site can
# NEVER publish while any [[ЗАПОЛНИТЬ...]] placeholder remains (no empty/invented data).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Legal requisites are filled (no placeholders)
        run: |
          if grep -RnF '[[ЗАПОЛНИТЬ' index.html privacy.html; then
            echo "::error::Заполните все [[ЗАПОЛНИТЬ...]] (ИНН/ОГРН/адрес/контакты/дата) в index.html и privacy.html — сайт не публикуется."
            exit 1
          fi
          echo "OK: нет незаполненных реквизитов."
      - name: Internal links resolve
        run: |
          rc=0
          for f in index.html privacy.html; do
            for l in $(grep -oE 'href="[^"]+"' "$f" | sed 's/href="//; s/"$//' | grep -vE '^(https?:|mailto:|tel:|#)'); do
              if [ ! -f "$l" ]; then echo "::error::$f ссылается на отсутствующий $l"; rc=1; fi
            done
          done
          [ "$rc" -eq 0 ] && echo "OK: внутренние ссылки корректны."
          exit $rc
      - name: CNAME matches the custom domain
        run: |
          test "$(tr -d '[:space:]' < CNAME)" = "mama-app.ru" || { echo "::error::CNAME должен содержать mama-app.ru"; exit 1; }
          echo "OK: CNAME = mama-app.ru."

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Auto-enable GitHub Pages (Actions build) on first deploy, so no manual
          # Settings toggle is needed. If org policy forbids it, enable Pages by hand
          # (Settings → Pages → Source: GitHub Actions) and re-run.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
